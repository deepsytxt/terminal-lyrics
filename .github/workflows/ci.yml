# No system packages: zbus and rustls need none, and aws-lc-sys builds with the
# runner's C compiler. Cross-compiling trips over it, hence the Windows runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Nobody here can try the SMTC backend by hand, so this is the only place
  # `tests/windows_probe.rs` runs.
  windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Nothing else exercises `install.sh`, and it breaks quietly; the release
  # workflow runs the same check against each new tag.
  install-script:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LYRICS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh

      - name: Run it
        run: '"${{ runner.temp }}/bin/lyrics" --version'
